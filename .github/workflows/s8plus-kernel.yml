name: S8 Plus - Kernel Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex \
            libssl-dev libelf-dev libncurses-dev \
            python3 git cpio rsync

      - name: Download kernel and toolchains
        shell: bash
        run: |
          set -euxo pipefail

          git clone --depth 1 \
            --branch lineage-20.0 \
            https://github.com/ViP3R-KERNELs/kernel_samsung_universal8895.git \
            kernel

          git clone --depth 1 \
            --branch lineage-19.1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git \
            gcc64

          git clone --depth 1 \
            --branch lineage-19.1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git \
            gcc32

          git -C kernel rev-parse HEAD | tee kernel-commit.txt

      - name: Configure dream2lte kernel for NetHunter
        shell: bash
        run: |
          set -euxo pipefail

          export PATH="$GITHUB_WORKSPACE/gcc64/bin:$GITHUB_WORKSPACE/gcc32/bin:$PATH"
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-

          make -C kernel O="$GITHUB_WORKSPACE/out" \
            HOSTCFLAGS="-O2 -fcommon" \
            exynos8895-dream2lte_defconfig

          # NetHunter USB HID via ConfigFS (not the legacy USB_G_HID driver)
          # Additional USB Wi-Fi drivers are built into the kernel (y).
          kernel/scripts/config --file out/.config \
            --disable USB_G_HID \
            --enable USB_CONFIGFS_F_HID \
            --enable MAC80211 \
            --enable BT_RFCOMM \
            --enable BT_RFCOMM_TTY \
            --enable ATH9K_HTC \
            --enable RTL8187 \
            --enable RTL8XXXU \
            --enable RT2800USB \
            --enable MT7601U

          make -C kernel O="$GITHUB_WORKSPACE/out" \
            HOSTCFLAGS="-O2 -fcommon" \
            olddefconfig

          cp out/.config kernel-final.config

          features=(
            USB_CONFIGFS_F_HID
            USB_F_HID
            MAC80211
            BT_RFCOMM
            BT_RFCOMM_TTY
            ATH9K_HTC
            RTL8187
            RTL8XXXU
            RT2800USB
            MT7601U
          )

          for feature in "${features[@]}"; do
            if ! grep -qx "CONFIG_${feature}=y" out/.config; then
              echo "ERROR: CONFIG_${feature} not enabled by olddefconfig" >&2
              grep -E "^(CONFIG_${feature}=|# CONFIG_${feature} is not set)" out/.config || true
              exit 1
            fi
          done

          if grep -qx 'CONFIG_USB_G_HID=y' out/.config; then
            echo 'ERROR: legacy USB_G_HID must remain disabled' >&2
            exit 1
          fi

          grep -E \
            'CONFIG_(USB_CONFIGFS_F_HID|USB_F_HID|USB_G_HID|MAC80211|BT_RFCOMM|ATH9K_HTC|RTL8187|RTL8XXXU|RT2800USB|MT7601U)' \
            out/.config | tee kernel-features.txt

      - name: Compile NetHunter kernel and device trees
        shell: bash
        run: |
          set -euxo pipefail

          export PATH="$GITHUB_WORKSPACE/gcc64/bin:$GITHUB_WORKSPACE/gcc32/bin:$PATH"
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-

          make -C kernel O="$GITHUB_WORKSPACE/out" \
            -j"$(nproc)" \
            Image Image.gz dtb.img \
            HOSTCFLAGS="-O2 -fcommon" \
            KCFLAGS="-Wno-error"

          for file in Image Image.gz dtb.img; do
            if [ ! -s "out/arch/arm64/boot/$file" ]; then
              echo "ERROR: expected output $file is missing or empty" >&2
              exit 1
            fi
          done

          ls -lh \
            out/arch/arm64/boot/Image \
            out/arch/arm64/boot/Image.gz \
            out/arch/arm64/boot/dtb.img

      - name: Collect diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p diagnostics

          for file in kernel-commit.txt kernel-features.txt kernel-final.config; do
            if [ -f "$file" ]; then
              cp "$file" diagnostics/
            fi
          done

          if [ -f out/.config ]; then
            cp out/.config diagnostics/.config
          fi

          for file in Image Image.gz dtb.img; do
            source="out/arch/arm64/boot/$file"
            if [ -s "$source" ]; then
              cp "$source" diagnostics/
              sha256sum "diagnostics/$file" > "diagnostics/$file.sha256"
            fi
          done

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s8plus-kernel-diagnostics
          path: diagnostics/
          retention-days: 7
          include-hidden-files: true
