
name: S8 Plus - LineageOS 20 NetHunter Kernel

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex \
            libssl-dev libelf-dev libncurses-dev \
            device-tree-compiler python3 git \
            cpio rsync lz4

      - name: Download matching LineageOS kernel and toolchains
        shell: bash
        run: |
          set -euxo pipefail

          git clone --depth 1 --branch lineage-20.0 \
            https://github.com/8890q/android_kernel_samsung_universal8895.git \
            kernel

          git -C kernel rev-parse HEAD | tee kernel-commit.txt

          EXPECTED="75a068570871b6f1e03c6972a81013475fdad2f0"
          ACTUAL="$(git -C kernel rev-parse HEAD)"

          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "ERROR: Kernel commit differs from installed ROM source"
            exit 1
          fi

          git clone --depth 1 --branch lineage-20.0 \
            https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b.git \
            clang

          git clone --depth 1 --branch lineage-19.1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git \
            gcc64

          git clone --depth 1 --branch lineage-19.1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git \
            gcc32

          export PATH="$GITHUB_WORKSPACE/clang/bin:$GITHUB_WORKSPACE/gcc64/bin:$GITHUB_WORKSPACE/gcc32/bin:$PATH"

          clang --version | tee compiler-version.txt

      - name: Configure NetHunter kernel
        shell: bash
        run: |
          set -euxo pipefail

          export PATH="$GITHUB_WORKSPACE/clang/bin:$GITHUB_WORKSPACE/gcc64/bin:$GITHUB_WORKSPACE/gcc32/bin:$PATH"
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/clang/lib64:$GITHUB_WORKSPACE/clang/lib:${LD_LIBRARY_PATH:-}"
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-

          make -C kernel O="$GITHUB_WORKSPACE/out" \
            CC=clang \
            HOSTCFLAGS="-O2 -fcommon" \
            exynos8895-dream2lte_defconfig

          # NetHunter USB HID, Bluetooth and USB Wi-Fi support
          kernel/scripts/config --file out/.config \
            --disable USB_G_HID \
            --enable USB_CONFIGFS_F_HID \
            --enable MAC80211 \
            --enable BT_RFCOMM \
            --enable BT_RFCOMM_TTY \
            --enable ATH_CARDS \
            --enable RT2X00 \
            --enable WL_MEDIATEK \
            --enable ATH9K_HTC \
            --enable RTL8187 \
            --enable RTL8XXXU \
            --enable RT2800USB \
            --enable MT7601U

          make -C kernel O="$GITHUB_WORKSPACE/out" \
            CC=clang \
            HOSTCFLAGS="-O2 -fcommon" \
            olddefconfig

          cp out/.config kernel-final.config

          features=(
            USB_CONFIGFS_F_HID
            USB_F_HID
            MAC80211
            BT_RFCOMM
            BT_RFCOMM_TTY
            ATH_CARDS
            RT2X00
            WL_MEDIATEK
            ATH9K_HTC
            RTL8187
            RTL8XXXU
            RT2800USB
            MT7601U
          )

          : > kernel-features.txt
          failed=0

          for feature in "${features[@]}"; do
            if grep -qx "CONFIG_${feature}=y" out/.config; then
              echo "OK: CONFIG_${feature}=y" | tee -a kernel-features.txt
            else
              echo "ERROR: CONFIG_${feature} is not enabled" \
                | tee -a kernel-features.txt
              failed=1
            fi
          done

          if grep -qx "CONFIG_USB_G_HID=y" out/.config; then
            echo "ERROR: Legacy USB_G_HID is enabled" \
              | tee -a kernel-features.txt
            failed=1
          fi

          exit "$failed"

      - name: Compile LineageOS NetHunter kernel
        shell: bash
        run: |
          set -euxo pipefail

          export PATH="$GITHUB_WORKSPACE/clang/bin:$GITHUB_WORKSPACE/gcc64/bin:$GITHUB_WORKSPACE/gcc32/bin:$PATH"
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/clang/lib64:$GITHUB_WORKSPACE/clang/lib:${LD_LIBRARY_PATH:-}"
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-

          make -C kernel O="$GITHUB_WORKSPACE/out" \
            -j4 \
            CC=clang \
            HOSTCFLAGS="-O2 -fcommon" \
            KCFLAGS="-Wno-error" \
            Image Image.gz dtb.img

          for file in Image Image.gz dtb.img; do
            if [ ! -s "out/arch/arm64/boot/$file" ]; then
              echo "ERROR: Missing output $file"
              exit 1
            fi
          done

          ls -lh out/arch/arm64/boot/Image \
            out/arch/arm64/boot/Image.gz \
            out/arch/arm64/boot/dtb.img

      - name: Collect kernel diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p diagnostics

          for file in \
            kernel-commit.txt \
            compiler-version.txt \
            kernel-features.txt \
            kernel-final.config; do

            if [ -f "$file" ]; then
              cp "$file" diagnostics/
            fi
          done

          if [ -f out/.config ]; then
            cp out/.config diagnostics/.config
          fi

          for file in Image Image.gz dtb.img; do
            source="out/arch/arm64/boot/$file"

            if [ -s "$source" ]; then
              cp "$source" diagnostics/
              sha256sum "diagnostics/$file" \
                > "diagnostics/$file.sha256"
            fi
          done

          echo "Diagnostic build only. Do not flash." \
            > diagnostics/NOT_FLASHABLE.txt

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s8plus-lineage20-nethunter-diagnostics
          path: diagnostics/
          retention-days: 7
          include-hidden-files: true
